<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 32" role="img" aria-label="NIGHTRUN">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbff"/>
      <stop offset="0.22" stop-color="#ffe95e"/>
      <stop offset="0.52" stop-color="#ff9e3d"/>
      <stop offset="0.78" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#c21bb4"/>
    </linearGradient>
  </defs>
  <!-- textLength pins the rendered width exactly, so the wordmark fills
       the viewBox on every platform's monospace font: no dead space,
       centering works. -->
  <text x="2" y="26" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace"
        font-size="27" font-weight="800" fill="url(#lg)"
        textLength="228" lengthAdjust="spacingAndGlyphs">NIGHTRUN</text>
</svg>
