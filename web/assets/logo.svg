<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 36" role="img" aria-label="NIGHTRUN">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbff"/>
      <stop offset="0.22" stop-color="#ffe95e"/>
      <stop offset="0.52" stop-color="#ff9e3d"/>
      <stop offset="0.78" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#c21bb4"/>
    </linearGradient>
  </defs>
  <!-- Splash-style wordmark: slight italic, magenta extrusion shadow,
       sunset gradient face. lengthAdjust="spacing" pins the width by
       flexing only the gaps — glyphs are never distorted. -->
  <g transform="skewX(-8)" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace"
     font-size="26" font-weight="800">
    <text x="16" y="29" fill="#ff2d95" opacity="0.5"
          textLength="210" lengthAdjust="spacing">NIGHTRUN</text>
    <text x="14" y="27" fill="url(#lg)"
          textLength="210" lengthAdjust="spacing">NIGHTRUN</text>
  </g>
</svg>
