[alias]
xtask = "run --release -p xtask --"

# aarch64 kernel tests run cross-compiled (static musl, linked by
# rust-lld — no cross-gcc needed) under qemu-user:
#   cargo test -p nr-tensor --target aarch64-unknown-linux-musl
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
runner = "qemu-aarch64-static"
